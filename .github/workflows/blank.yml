name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run endpoint sanity checks
        run: |
          python -c "from app import app; client = app.test_client(); assert client.get('/').status_code == 200; assert client.get('/static/chat.js').status_code == 200; res = client.post('/predict', json={'age': 55, 'sex': 1, 'cp': 0, 'trestbps': 130, 'chol': 250, 'fbs': 0, 'restecg': 0, 'thalach': 150, 'exang': 0, 'oldpeak': 1.0, 'slope': 1}); assert res.status_code == 200; print('Verification tests passed successfully!')"
