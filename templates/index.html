<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heart Risk Chatbot</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="chat">
    <div class="header">Heart Risk Assistant</div>
    <div id="messages"></div>
    <div id="options"></div>
    <div class="input-row">
      <input id="input" type="text" placeholder="Type your answer..." autocomplete="off">
      <button id="send">Send</button>
    </div>
    <div class="note">Educational tool only. Not a medical diagnosis.</div>
  </div>
  <script src="/static/chat.js"></script>
</body>
</html>
